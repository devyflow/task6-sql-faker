databases:
  - name: devyanshu-sql-faker-db
    databaseName: sql_faker
    user: sql_faker_user
    plan: free
    region: oregon

services:
  - type: web
    name: devyanshu-sql-faker
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devyanshu-sql-faker-db
          property: connectionString
